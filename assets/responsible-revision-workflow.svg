<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Responsible academic revision workflow</title>
  <desc id="desc">A five-step workflow: understand the assignment, map source use, revise in the writer's voice, cite clearly, and review with human judgment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#071a2e"/>
      <stop offset="1" stop-color="#103a55"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00101d" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="64" y="64" fill="#d5f3eb" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">RESPONSIBLE REVISION LOOP</text>
  <text x="64" y="101" fill="#ffffff" font-family="Georgia, serif" font-size="31" font-weight="700">Build clearer work without losing authorship</text>
  <g fill="none" stroke="#77d8c4" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M237 209H282"/><path d="M465 209H510"/><path d="M693 209H738"/><path d="M921 209H966"/>
  </g>
  <g fill="#77d8c4">
    <path d="M282 203l12 6-12 6z"/><path d="M510 203l12 6-12 6z"/><path d="M738 203l12 6-12 6z"/><path d="M966 203l12 6-12 6z"/>
  </g>
  <g filter="url(#shadow)">
    <g transform="translate(64 151)">
      <rect width="173" height="118" rx="16" fill="#f4fbf8"/>
      <circle cx="31" cy="30" r="17" fill="#0e896f"/><text x="31" y="36" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">1</text>
      <text x="24" y="75" fill="#10283a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Read the brief</text>
      <text x="24" y="99" fill="#537080" font-family="Arial, sans-serif" font-size="13">Purpose &amp; criteria first</text>
    </g>
    <g transform="translate(292 151)">
      <rect width="173" height="118" rx="16" fill="#f4fbf8"/>
      <circle cx="31" cy="30" r="17" fill="#0e896f"/><text x="31" y="36" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">2</text>
      <text x="24" y="75" fill="#10283a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Map sources</text>
      <text x="24" y="99" fill="#537080" font-family="Arial, sans-serif" font-size="13">Quote, paraphrase, cite</text>
    </g>
    <g transform="translate(520 151)">
      <rect width="173" height="118" rx="16" fill="#f4fbf8"/>
      <circle cx="31" cy="30" r="17" fill="#0e896f"/><text x="31" y="36" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">3</text>
      <text x="24" y="75" fill="#10283a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Revise meaning</text>
      <text x="24" y="99" fill="#537080" font-family="Arial, sans-serif" font-size="13">Use your own analysis</text>
    </g>
    <g transform="translate(748 151)">
      <rect width="173" height="118" rx="16" fill="#f4fbf8"/>
      <circle cx="31" cy="30" r="17" fill="#0e896f"/><text x="31" y="36" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
      <text x="24" y="75" fill="#10283a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Document use</text>
      <text x="24" y="99" fill="#537080" font-family="Arial, sans-serif" font-size="13">Make attribution clear</text>
    </g>
    <g transform="translate(976 151)">
      <rect width="173" height="118" rx="16" fill="#e1f7ef"/>
      <circle cx="31" cy="30" r="17" fill="#0e896f"/><text x="31" y="36" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">5</text>
      <text x="24" y="75" fill="#10283a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Review &amp; learn</text>
      <text x="24" y="99" fill="#537080" font-family="Arial, sans-serif" font-size="13">Apply human judgment</text>
    </g>
  </g>
  <text x="64" y="322" fill="#a7d9cd" font-family="Arial, sans-serif" font-size="14">Similarity indicators are prompts for inquiry—not grades, guarantees, or a substitute for academic policy.</text>
</svg>
